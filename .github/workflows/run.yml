name: run-tutorial
run-name: "run ${{ inputs.run_id }}"
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "runs.id in Supabase", required: true }
      video_url: { description: "MP4 URL (empty for YouTube)", required: false }
      source_url: { description: "Tutorial page", required: false }
      unattended: { description: "1 = nobody is watching (benchmark): skip login hand-overs", required: false, default: "0" }
concurrency: { group: "run-${{ inputs.run_id }}" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pipx install yt-dlp
      - run: npm ci --ignore-scripts && npm run build -w @origin/core && npm run build -w @origin/runner && npx -w @origin/runner playwright install --with-deps chromium-headless-shell
      - name: Keep the sandbox away from the cloud metadata service
        run: sudo iptables -I OUTPUT -d 169.254.169.254 -m owner --uid-owner 0 -j DROP
      - name: Run tutorial
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          ORIGIN_UNATTENDED: ${{ inputs.unattended }}
          RUN_ID: ${{ inputs.run_id }}
          VIDEO_URL: ${{ inputs.video_url }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: node packages/runner/dist/main.js --run-id "$RUN_ID" --video-url "$VIDEO_URL" --source-url "$SOURCE_URL"
      - name: Mark the run failed if the job died
        if: cancelled() || failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          curl -s -X PATCH "$SUPABASE_URL/rest/v1/runs?id=eq.$RUN_ID&status=in.(queued,extracting,running,waiting_user)"             -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "Content-Type: application/json"             -d "{\"status\":\"failed\",\"error\":\"The run machine stopped before finishing.\",\"finished_at\":\"$(date -u +%FT%TZ)\"}"
