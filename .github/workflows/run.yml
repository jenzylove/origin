name: run-tutorial
run-name: "run ${{ inputs.run_id }}"
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "runs.id in Supabase", required: true }
      video_url: { description: "MP4 URL", required: true }
      source_url: { description: "Tutorial page", required: false }
concurrency: { group: "run-${{ inputs.run_id }}" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --ignore-scripts && npm run build -w @origin/core && npm run build -w @origin/runner
      - name: Run tutorial
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
        run: node packages/runner/dist/main.js --run-id "${{ inputs.run_id }}" --video-url "${{ inputs.video_url }}" --source-url "${{ inputs.source_url }}"
